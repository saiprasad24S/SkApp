; SkandanHomecarre EmployeeHub — Supervisor Configuration
; Place at: /etc/supervisor/conf.d/skandanhomecarre.conf

[program:skandanhomecarre]
command=/home/skandan/app/backend/.venv/bin/daphne -b 127.0.0.1 -p 8000 skandan.asgi:application
directory=/home/skandan/app/backend
user=skandan
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/skandanhomecarre/error.log
stdout_logfile=/var/log/skandanhomecarre/access.log
stderr_logfile_maxbytes=10MB
stdout_logfile_maxbytes=10MB
stderr_logfile_backups=5
stdout_logfile_backups=5
environment=
    DJANGO_SETTINGS_MODULE="skandan.settings",
    PYTHONPATH="/home/skandan/app/backend"
