# SkandanHomecarre EmployeeHub — Nginx Configuration
# Domain: employees.skandanhomecarrecclinic.com
# Place at: /etc/nginx/sites-available/skandanhomecarre
# Symlink: ln -s /etc/nginx/sites-available/skandanhomecarre /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name employees.skandanhomecarrecclinic.com;

    client_max_body_size 150M;

    # --- Django Static Files ---
    location /static/ {
        alias /home/skandan/app/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- APK Direct Download ---
    location /SkandanHomecarre.apk {
        alias /home/skandan/app/apk/SkandanHomecarre.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="SkandanHomecarre.apk"';
    }

    # --- WebSocket Connections (Chat & Presence) ---
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # --- Django REST API ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django Admin ---
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend SPA (Admin Dashboard) ---
    root /home/skandan/app/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
